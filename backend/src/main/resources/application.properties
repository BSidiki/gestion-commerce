spring.application.name=gestion-commerce

# Le service n'écoute que sur ce PC au MVP (poste unique).
# Le réseau local (version 1.1) passera cette valeur à 0.0.0.0.
server.address=127.0.0.1
server.port=8080

# Dossier des données, distinct du dossier d'installation.
# Surchargeable par -Dapp.data-dir=... ou la variable GESTION_DATA_DIR.
app.data-dir=./data

# SQLite : un seul fichier, détenu exclusivement par ce service.
# WAL + synchronous=FULL : résistance aux coupures de courant.
spring.datasource.url=jdbc:sqlite:${app.data-dir}/gestion.db?journal_mode=WAL&synchronous=FULL&foreign_keys=true&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite n'accepte qu'un écrivain à la fois : une seule connexion évite tout verrou.
spring.datasource.hikari.maximum-pool-size=1

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=true
server.error.include-message=always

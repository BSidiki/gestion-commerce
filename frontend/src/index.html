<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Gestion commerciale</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Thème et taille du texte du poste, posés avant l'affichage pour éviter un éclair de l'autre thème.
    try {
      var t = localStorage.getItem('gc.theme');
      var dark = t === 'sombre' || (t !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.scale = localStorage.getItem('gc.scale') || 'normale';
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
